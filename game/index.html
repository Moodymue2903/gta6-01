<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERMILION KEYS — an open-world crime game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0f1e;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif; color: #fff; }
  #game, #game canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .panel { background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(255, 194, 122, .55);
    border-radius: 6px; padding: 8px 12px; backdrop-filter: blur(2px); }

  /* Mission card, top-left. Gold accent. */
  #mission-card { position: absolute; top: 14px; left: 14px; width: 380px;
    background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(251, 191, 36, .55);
    border-left: 5px solid #fbbf24; border-radius: 6px; padding: 10px 14px; }
  .m-job { color: #fbbf24; font-weight: 800; letter-spacing: 1px; font-size: 15px; }
  .m-obj { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 3px 0; }
  .m-stage { color: #9fd8dd; font-size: 15px; letter-spacing: .5px; }
  .m-timer { color: #ff6a4a; font-weight: 800; }

  /* Wanted stars, top-centre. GTA 6 states: grey REPORTED, white
     acknowledged, red engaged; amber HEAT bar while unseen. */
  #wanted { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    text-align: center; padding: 6px 20px 8px; border-radius: 6px;
    background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(255, 255, 255, .12); }
  #wanted.hot { background: rgba(120, 10, 20, .88); border: 1.5px solid rgba(239, 68, 68, .6); }
  .w-label { display: block; color: #ffb0a0; font-weight: 800; letter-spacing: 4px; font-size: 14px; }
  .w-stars { font-size: 32px; line-height: 1; letter-spacing: 2px; }
  .star { color: #5a4a52; }
  .star.on { color: #ffd23a; text-shadow: 0 0 8px rgba(255, 210, 58, .8); }
  #wanted.grey .star.on { color: #9aa0a6; text-shadow: 0 0 8px rgba(154, 160, 166, .8); }
  #wanted.red .star.on { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, .9); }
  #wanted.heat-only .w-stars { display: none; }
  .w-heat { width: 160px; height: 8px; background: #3a2a1a; border-radius: 4px;
    margin: 5px auto 0; display: none; overflow: hidden; }
  #wanted.heat-only .w-heat { display: block; }
  .w-heat i { display: block; height: 100%; background: #f59e0b; border-radius: 4px; }
  .w-state { font-size: 13px; letter-spacing: 1px; color: #fbbf24; font-weight: 700;
    min-height: 15px; margin-top: 3px; }
  #wanted.heat-only .w-state { color: #f59e0b; }

  /* Witness banner, under the wanted block. FIX ROUND 4: top 112 -> 128
     so it can never touch the wanted panel (with the heat bar the panel
     reaches ~106 px). The roster starts at 172 px; the banner (~35 px)
     ends at ~163 px, clear of both. */
  #witness-banner { position: absolute; top: 128px; left: 50%; transform: translateX(-50%);
    display: none; background: rgba(120, 20, 10, .88); border: 1.5px solid #ef4444;
    color: #fff; font-weight: 800; letter-spacing: 1px; font-size: 15px;
    padding: 7px 16px; border-radius: 5px; animation: pulse 1.2s infinite; white-space: nowrap; }
  #witness-banner.show { display: block; }

  /* Police roster, left under the mission card. Crimson accent. */
  #police-roster { position: absolute; top: 172px; left: 14px; width: 340px; display: none;
    background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(239, 68, 68, .55);
    border-radius: 6px; padding: 10px 12px; font-size: 15px; }
  #police-roster.show { display: block; }
  .r-head { color: #ff9a8a; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; font-size: 15px; }
  .r-row { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .r-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3a3a; flex: none; }
  .r-row b { margin-left: auto; color: #ffd9a0; }
  .badge { font-style: normal; font-size: 12px; font-weight: 800; letter-spacing: .5px;
    padding: 2px 7px; border-radius: 4px; color: #fff; }
  .b-ram { background: #dc2626; }
  .b-flank { background: #ea580c; }
  .b-air { background: #0891b2; }
  .b-block { background: #ca8a04; }
  .b-swat { background: #7c3aed; }
  .b-pursuit { background: #b91c1c; }
  .b-search { background: #4b5563; }

  /* Cash + respect, top-right. Gold accent. */
  #cash-box { position: absolute; top: 14px; right: 14px; text-align: right;
    background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(251, 191, 36, .55);
    border-radius: 6px; padding: 8px 14px; }
  .cash { color: #7ddb8a; font-size: 36px; font-weight: 800; line-height: 1; }
  .rank { font-size: 14px; letter-spacing: 1px; color: #ffd9a0; margin-top: 3px; }
  .rank-bar { width: 170px; height: 6px; background: #3a2a3a; border-radius: 3px; margin-top: 4px; margin-left: auto; }
  .rank-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff6a4a, #ffc27a); border-radius: 3px; }

  /* Minimap, bottom-left. FIX ROUND 4: 230 -> 260 px (the re-test
     faulted the small flat minimap). */
  #minimap-wrap { position: absolute; left: 14px; bottom: 14px; width: 266px; height: 266px; }
  #minimap { width: 260px; height: 260px; border-radius: 50%; display: block;
    border: 3px solid rgba(255, 194, 122, .85); background: #1d6f7d; }
  #location { position: absolute; bottom: -2px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: 2px; color: #ffd9a0; font-weight: 700; }

  /* Speed, bottom-right. Cyan accent. */
  #speed-box { position: absolute; right: 14px; bottom: 14px; text-align: right;
    background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(56, 189, 248, .55);
    border-radius: 6px; padding: 8px 14px; min-width: 190px; }
  .spd b { font-size: 54px; font-weight: 800; line-height: .9; }
  .spd span { color: #9fd8dd; font-size: 15px; margin-left: 6px; }
  .veh { color: #ffc27a; font-weight: 700; letter-spacing: 1px; font-size: 15px; }
  .cond { height: 6px; background: #3a2a3a; border-radius: 3px; margin-top: 5px; }
  .cond i { display: block; height: 100%; background: #7ddb8a; border-radius: 3px; }
  .cond-lbl { font-size: 13px; color: #b0a0b0; margin-top: 2px; }

  /* Weapon slots + radio, right edge. */
  #weapon-slots { position: absolute; right: 14px; top: 130px; display: flex; flex-direction: column; gap: 5px; }
  .ws { background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(255, 255, 255, .18);
    border-radius: 5px; padding: 5px 9px; font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .ws b { color: #9fd8dd; margin-right: 6px; }
  .ws span { color: #b0a0b0; margin-left: 6px; font-weight: 400; }
  .ws.on { border-color: #ffc27a; background: rgba(255, 140, 60, .3); }
  #radio-box { position: absolute; right: 14px; top: 350px; color: #ff9ad9; font-size: 14px;
    font-weight: 700; letter-spacing: 1px; background: rgba(10, 14, 26, .88);
    padding: 5px 9px; border-radius: 5px; }

  /* Crew chips, right bottom. Cyan accent. */
  #crew-chips { position: absolute; right: 14px; bottom: 150px; display: flex; flex-direction: column; gap: 5px; }
  .crew { background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(56, 189, 248, .4);
    border-radius: 5px; padding: 5px 9px; font-size: 15px; }
  .crew b { color: #ffc27a; margin-right: 6px; }
  .crew i { font-style: normal; color: #b0a0b0; margin-left: 6px; }
  .crew.ready { border-color: #7ddb8a; }
  .crew.ready i { color: #7ddb8a; }

  /* Dialogue, bottom-centre (above the scanner ticker). */
  #dialogue { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%);
    width: 520px; max-width: 60vw; display: none; gap: 10px; align-items: flex-start;
    background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(251, 191, 36, .5);
    border-radius: 8px; padding: 10px 14px; }
  #dialogue.show { display: flex; }
  .dlg-face { width: 44px; height: 44px; flex: none; border-radius: 6px; background: #2ea88a;
    color: #fff; font-size: 26px; font-weight: 800; display: flex; align-items: center;
    justify-content: center; }
  .dlg-body b { color: #ffc27a; letter-spacing: 1px; font-size: 15px; }
  .dlg-body b i { color: #9fd8dd; font-style: normal; margin-left: 6px; font-size: 12px; }
  .dlg-body span { display: block; font-size: 17px; line-height: 1.35; margin-top: 2px; }

  /* Banner, centre. */
  #banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
    text-align: center; display: none; }
  #banner.show { display: block; }
  #banner h2 { font-size: 40px; letter-spacing: 3px; color: #ffc27a;
    text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #banner p { font-size: 16px; color: #fff; margin-top: 4px; }

  /* Prompt, above the dialogue. */
  #prompt { position: absolute; left: 50%; bottom: 160px; transform: translateX(-50%);
    display: none; background: rgba(10, 14, 26, .88); border: 1.5px solid #ffc27a;
    border-radius: 5px; padding: 6px 14px; font-weight: 700; letter-spacing: 1px; font-size: 16px; }
  #prompt.show { display: block; }

  /* Scanner ticker, bottom strip. */
  #scanner-ticker { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    display: none; background: rgba(10, 14, 26, .88); border-top: 1.5px solid rgba(239, 68, 68, .6);
    padding: 7px 18px; font-size: 15px; letter-spacing: .5px; max-width: 640px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #scanner-ticker.show { display: block; }
  #scanner-ticker b { color: #ff9a8a; margin-right: 10px; letter-spacing: 2px; font-size: 13px; }

  /* Crosshair. */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); display: none; }
  #crosshair.show { display: block; }
  .ch-dot { position: absolute; left: 9px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,.85); }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }

  /* Damage flash vignette. */
  #vignette { position: absolute; inset: 0; display: none; pointer-events: none; }
  #vignette.show { display: block; }
  #vignette.hurt { box-shadow: inset 0 0 120px 40px rgba(255, 30, 30, .55); }
  #vignette.boom { box-shadow: inset 0 0 140px 60px rgba(255, 120, 20, .6); }
  #vignette.land { box-shadow: inset 0 0 90px 20px rgba(255, 255, 255, .35); }

  /* Weapon wheel. */
  #weapon-wheel { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px;
    transform: translate(-50%, -50%); display: none; }
  #weapon-wheel.open { display: block; }
  .ww-slot { position: absolute; left: 50%; top: 50%; width: 110px; padding: 8px 10px;
    background: rgba(10, 14, 26, .88); border: 1.5px solid rgba(255, 194, 122, .5);
    border-radius: 6px; text-align: center; }
  .ww-slot:nth-child(1) { transform: translate(-50%, -50%) translateY(-105px); }
  .ww-slot:nth-child(2) { transform: translate(-50%, -50%) translateX(105px); }
  .ww-slot:nth-child(3) { transform: translate(-50%, -50%) translateY(105px); }
  .ww-slot:nth-child(4) { transform: translate(-50%, -50%) translateX(-105px); }
  .ww-slot b { display: block; color: #9fd8dd; }
  .ww-slot span { font-weight: 700; letter-spacing: 1px; }

  /* Menus. */
  #menus { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  #title-screen, #pause-screen, #end-screen { position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, rgba(26, 10, 30, .55), rgba(60, 20, 40, .78)); }
  #title-screen.show, #pause-screen.show, #end-screen.show { display: flex; }
  .t-kicker { letter-spacing: 5px; color: #9fd8dd; font-size: 13px; font-weight: 700; }
  #title-screen h1, #pause-screen h1, #end-screen h1 { font-size: 84px; line-height: .95;
    letter-spacing: 4px; color: #ffc27a; text-shadow: 0 4px 30px rgba(255, 120, 40, .6); margin: 14px 0; }
  .t-sub { font-size: 18px; color: #ffe9c9; max-width: 640px; }
  .t-controls { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center;
    max-width: 700px; margin: 26px 0; font-size: 13px; color: #d8c8d8; }
  .t-controls b { color: #ffc27a; }
  .t-start { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #fff;
    animation: pulse 1.4s infinite; margin-top: 8px; }
  .t-save { margin-top: 14px; color: #9fd8dd; font-size: 13px; }
  .p-row { font-size: 15px; color: #d8c8d8; margin-top: 6px; }
  .p-row span { margin: 0 10px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* Career screen (T). FIX ROUND 4: the panels no longer stretch to
     fill the screen (flex: 1 left ~200 px of empty panel under the
     stats and saves). Content-height panels, centred vertically, so
     the screen reads as composed, not empty. */
  #career-screen { position: absolute; inset: 0; display: none; flex-direction: column;
    justify-content: center; background: #080a14; padding: 26px 36px; }
  #career-screen.show { display: flex; }
  .career-head { display: flex; justify-content: space-between; align-items: baseline; }
  .career-head h1 { font-size: 34px; letter-spacing: 3px; color: #fbbf24; }
  .career-head span { font-size: 17px; color: #ffd9a0; font-weight: 700; }
  .career-panels { display: flex; gap: 20px; margin-top: 16px; flex: 0 0 auto; min-height: 0; }
  .career-panel { flex: 1; background: rgba(10, 14, 26, .92); border: 1.5px solid rgba(251, 191, 36, .55);
    border-radius: 8px; padding: 14px 16px; }
  .map-panel { flex: 1.5; }
  .cp-head { font-size: 16px; font-weight: 800; letter-spacing: 1px; color: #fbbf24; margin-bottom: 10px; }
  .cs-row { display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .08); font-size: 16px; }
  .cs-row span { color: #c8d0dc; }
  .cs-row b { color: #fff; }
  .cs-foot { margin-top: 14px; font-size: 14px; color: #9fd8dd; font-weight: 700; }
  .slot { padding: 10px 12px; border: 1.5px solid rgba(255, 255, 255, .2); border-radius: 6px; margin-bottom: 10px; }
  .slot b { display: block; font-size: 16px; }
  .slot span { color: #c8d0dc; font-size: 14px; }
  .slot.empty { opacity: .5; }
  #career-map { width: 100%; border-radius: 6px; border: 1px solid rgba(255, 255, 255, .2); display: block; }
  .map-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: #c8d0dc; }
  .map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .lg-gold { background: #ffc27a; } .lg-cyan { background: #38bdf8; }
  .lg-red { background: #ff4030; } .lg-white { background: #fff; }
  .career-strip { display: flex; gap: 10px; margin-top: 16px; }
  .ms { flex: 1; background: rgba(10, 14, 26, .92); border: 1.5px solid rgba(255, 255, 255, .18);
    border-radius: 6px; padding: 8px 10px; }
  .ms.done { border-color: rgba(251, 191, 36, .7); }
  .ms b { display: block; font-size: 13px; color: #ffd9a0; }
  .ms span { display: block; font-size: 12px; color: #c8d0dc; margin-top: 2px; }
  .ms i { font-style: normal; font-size: 12px; font-weight: 800; color: #7ddb8a; }
  .ms:not(.done) i { color: #8a94a6; }
  .career-close { text-align: center; margin-top: 12px; font-size: 14px; letter-spacing: 2px; color: #9fd8dd; }

  /* Garage screen (E at the garage): right-side panel, the 3D car shows left. */
  #garage-screen { position: absolute; inset: 0; display: none; justify-content: flex-end;
    background: linear-gradient(90deg, rgba(8, 10, 20, .1), rgba(8, 10, 20, .55)); }
  #garage-screen.show { display: flex; }
  .garage-panel { width: 460px; background: #0a0e1a;
    border-left: 1.5px solid rgba(56, 189, 248, .6); padding: 26px 28px; overflow: auto; }
  .gp-head { font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #38bdf8; }
  .gp-car { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: 17px; }
  .gp-car b { flex: 1; }
  .gp-car span { color: #c8d0dc; font-size: 14px; }
  .gp-swatch { width: 26px; height: 26px; border-radius: 5px; border: 2px solid #fff; flex: none; }
  .gb-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 15px; }
  .gb-row span { width: 110px; color: #c8d0dc; flex: none; }
  .gb-bar { flex: 1; height: 10px; background: #2a3442; border-radius: 5px; }
  .gb-bar i { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #7ddb8a); border-radius: 5px; }
  .gb-row b { width: 90px; text-align: right; flex: none; }
  .gp-cash { font-size: 18px; margin: 14px 0; color: #7ddb8a; }
  .gp-cash b { color: #fff; }
  .up { display: flex; gap: 10px; align-items: center; padding: 9px 10px;
    border: 1.5px solid rgba(255, 255, 255, .18); border-radius: 6px; margin-bottom: 8px; }
  .up > b:first-child { color: #9fd8dd; font-size: 16px; }
  .up-body { flex: 1; }
  .up-body span { display: block; font-size: 16px; font-weight: 700; }
  .up-body i { font-style: normal; font-size: 13px; color: #9fb0c0; }
  .up-price { color: #7ddb8a; font-size: 16px; }
  .up.poor { opacity: .55; }
  .up.maxed { border-color: #fbbf24; }
  .gp-next { font-size: 15px; font-weight: 800; color: #fbbf24; margin-top: 14px; }
  .gp-note { font-size: 13px; color: #9fd8dd; margin-top: 6px; }
  .gp-msg { font-size: 14px; color: #7ddb8a; margin-top: 8px; font-weight: 700; }
  .gp-keys { text-align: center; margin-top: 16px; font-size: 14px; letter-spacing: 2px; color: #9fd8dd; }

  #err { position: absolute; top: 0; left: 0; right: 0; z-index: 50; color: #ff8080;
    background: rgba(40, 0, 0, .8); font: 12px monospace; padding: 2px 8px; white-space: pre-wrap; }
  @media (max-width: 900px) {
    #mission-card { width: 250px; } .m-obj { font-size: 15px; }
    #minimap-wrap { width: 140px; height: 140px; } #minimap { width: 134px; height: 134px; }
    #title-screen h1 { font-size: 52px; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<div id="menus"></div>
<div id="err"></div>
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
